services:
  database:
    image: postgres:15-alpine
    container_name: kpd-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kpd-network

  backend:
    build: ./backend
    container_name: kpd-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: database
    depends_on:
      - database
    ports:
      - "4000:4000"
    networks:
      - kpd-network

  frontend:
    build: ./frontend
    container_name: kpd-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - kpd-network

volumes:
  pgdata:

networks:
  kpd-network:
    driver: bridge